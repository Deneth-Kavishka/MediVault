<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1494B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Heart shape integrated with heartbeat -->
  <g fill="white" opacity="0.9">
    <path d="M 32,48 C 28,44 20,38 18,32 C 16,26 18,22 22,22 C 26,22 29,25 32,28 C 35,25 38,22 42,22 C 46,22 48,26 46,32 C 44,38 36,44 32,48 Z"/>
  </g>
  
  <!-- Red heartbeat line -->
  <g stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- ECG/Heartbeat waveform in red -->
    <path d="M 8,32 L 16,32 L 19,28 L 22,38 L 26,18 L 30,42 L 34,32 L 56,32" opacity="0.95"/>
  </g>
  
  <!-- Subtle glow effect -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>
</svg>
